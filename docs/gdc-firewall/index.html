function pick() {
  try { const saved = localStorage.getItem("gdcfw-lang"); if (T[saved]) return saved; } catch (e) {}
  const nav = (navigator.language || "ro").slice(0, 2).toLowerCase();
  return T[nav] ? nav : "en";
}

  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n] || ""; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml] || ""; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  try { localStorage.setItem("gdcfw-lang", lang); } catch (e) {}
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => apply(b.dataset.lang)));
apply(pick());

// Versiunea arătată la descărcare e cea SERVITĂ (update.json), nu una scrisă de mână.
fetch("update.json", { cache: "no-store" })
  .then(r => r.json())
  .then(j => {
    document.getElementById("version").textContent = j.app_version || j.version || "—";
    // Arhiva cu versiunea în nume, din aceeași sursă ca actualizarea automată:
    // o pagină rămasă în cache duce tot la ultima versiune.
    const url = j.download_url && (j.download_url.mac || j.download_url);
    if (typeof url === "string" && /GDCFirewall-macOS-[0-9.]+\.zip$/.test(url)) document.getElementById("download").href = url;
  })
  .catch(() => {});
</script>
</body>
</html>
