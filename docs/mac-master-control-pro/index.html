// Capturi disponibile: platforma-limba-tema-captura
const HAVE = new Set([
 ...['home','map','selection','review'].flatMap(s=>['en-light','es-light','ro-light','en-dark'].map(c=>`mac-${c}-${s}`)),
 'mac-en-light-advanced','mac-en-light-settings',
 ...['home','map','selection','review','advanced','settings'].flatMap(s=>['en-light','es-light','ro-light','en-dark'].map(c=>`win-${c}-${s}`))
]);
const SHOTS = ['home','map','selection','review','advanced','settings'];
let lang = (localStorage.getItem('mcsp-lang') || (navigator.language||'ro').slice(0,2));
if (!T[lang]) lang='en';
let plat = /Windows/i.test(navigator.userAgent) ? 'win' : 'mac';
let shot = 'map';
let theme='light';
function src(p,l,th,s){ const ids=[`${p}-${l}-${th}-${s}`,`${p}-${l}-light-${s}`,`${p}-en-${th}-${s}`,`${p}-en-light-${s}`]; const k=ids.find(i=>HAVE.has(i)); return k?`img/${k}.${p==='win'?'webp':'jpg'}`:null; }
function render(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{ const v=t[e.dataset.i]; if(v!==undefined) e.textContent=v; });
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  document.getElementById('tab-mac').setAttribute('aria-pressed',plat==='mac'); document.getElementById('tab-win').setAttribute('aria-pressed',plat==='win');
  const th=theme; const th_ids=document.getElementById('thumbs'); th_ids.innerHTML='';
  SHOTS.forEach(s=>{ const u=src(plat,lang,th,s); if(!u) return; const b=document.createElement('button'); b.setAttribute('aria-pressed',s===shot); b.innerHTML=`<img src="${u}" alt="" loading="lazy" width="320" height="200"><span>${t.shots[s]}</span>`; b.onclick=()=>{shot=s;render();}; th_ids.appendChild(b); });
  let u=src(plat,lang,th,shot) || src(plat,lang,th,'map'); const big=document.getElementById('bigshot'); if(u){ big.src=u; big.alt=`${plat==='mac'?'macOS':'Windows'} — ${t.shots[shot]}`; }
  document.getElementById('cap2').textContent=`${plat==='mac'?'macOS':'Windows'} · ${t.shots[shot]}`;
  document.getElementById('th-light').setAttribute('aria-pressed',theme==='light'); document.getElementById('th-dark').setAttribute('aria-pressed',theme==='dark');
  document.getElementById('plat-rows').innerHTML=t.plat.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  const note=document.getElementById('os-note'); const ua=navigator.userAgent||''; note.textContent=/Windows/i.test(ua)?t.note_win:/Macintosh|Mac OS X/i.test(ua)?t.note_mac:'';
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('mcsp-lang',lang)}catch(e){}render();});
document.querySelectorAll('.tabs button[data-p]').forEach(b=>b.onclick=()=>{plat=b.dataset.p;render();});
document.querySelectorAll('.tabs button[data-t]').forEach(b=>b.onclick=()=>{theme=b.dataset.t;render();});
document.getElementById('year').textContent=new Date().getFullYear();
render();
// Linkuri de descarcare: ultimul release, nume cu versiune (Regula 41); degradare gratioasa la pagina release-ului.
async function link(repo,id,re){ try{ const r=await fetch(`https://api.github.com/repos/${repo}/releases/latest`); if(!r.ok) return; const d=await r.json(); const a=(d.assets||[]).find(x=>re.test(x.name)); if(a) document.getElementById(id).href=a.browser_download_url; }catch(e){} }
link('gordasgdc/mac-master-control-pro','btn-mac',/^MasterControlStudioPro-[0-9.]+\.dmg$/);
link('gordasgdc/mac-master-control-pro-win','btn-win',/^MasterControlStudioPro-[0-9.]+-Setup\.exe$/);
</script>
