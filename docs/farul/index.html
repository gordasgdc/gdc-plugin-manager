<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farul — macOS system monitor</title>
<meta name="description" content="Farul: free, lightweight system monitor for the macOS menu bar. CPU, memory, network, disks, battery, processes.">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f3ee;--fg:#1b1a17;--mut:#6a655b;--card:#fff;--line:#e3ddd1;--acc:#c46a1a;--accfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161a;--fg:#edeff2;--mut:#9aa0aa;--card:#1a1d22;--line:#2b2f36;--acc:#e8933a;--accfg:#14161a}}
:root[data-theme=dark]{--bg:#14161a;--fg:#edeff2;--mut:#9aa0aa;--card:#1a1d22;--line:#2b2f36;--acc:#e8933a;--accfg:#14161a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.w{max-width:1040px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}.brand img{width:34px;height:34px}
.lang{display:flex;gap:6px}.lang button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:14px}
.lang button[aria-pressed=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.hero{padding:36px 0 24px;text-align:center}h1{font-size:clamp(32px,6vw,54px);line-height:1.1;margin:0 0 12px}
.hero p{max-width:620px;margin:0 auto 22px;color:var(--mut);font-size:18px}
.btn{display:inline-block;background:var(--acc);color:var(--accfg);padding:14px 26px;border-radius:12px;font-weight:700;text-decoration:none}
.sub{display:block;margin-top:10px;color:var(--mut);font-size:14px}
.shot{margin:28px auto 0;max-width:960px}.shot img{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:36px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.card h3{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--mut);font-size:15px}
.steps{margin:0 0 36px;padding-left:20px;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mut);font-size:14px}footer a{color:var(--mut)}
</style>
</head>
<body>
<div class="w">
<header>
  <div class="brand"><img src="img/icon.svg" alt="">Farul</div>
  <div class="lang" role="group" aria-label="Language"><button data-l="ro">RO</button><button data-l="en">EN</button><button data-l="es">ES</button></div>
</header>
<section class="hero">
  <h1 data-i="h1"></h1>
  <p data-i="lead"></p>
  <a class="btn" id="dl" href="https://github.com/gordasgdc/farul/releases/download/v0.2.0/Farul-0.2.0.pkg"><span data-i="dl"></span></a>
  <span class="sub" data-i="req"></span>
  <div class="shot"><img id="shot" alt="Farul" width="1040" height="580"></div>
</section>
<section class="grid">
  <div class="card"><h3 data-i="c1t"></h3><p data-i="c1"></p></div>
  <div class="card"><h3 data-i="c2t"></h3><p data-i="c2"></p></div>
  <div class="card"><h3 data-i="c3t"></h3><p data-i="c3"></p></div>
  <div class="card"><h3 data-i="c4t"></h3><p data-i="c4"></p></div>
</section>
<h2 data-i="ih"></h2>
<ol class="steps"><li data-i="i1"></li><li data-i="i2"></li><li data-i="i3"></li></ol>
<footer>
  <div data-i="credit"></div>
  <div><a href="https://github.com/gordasgdc/farul" data-i="src"></a> · <a href="https://gordas.dev/termeni" data-i="terms"></a> · <a href="https://gordas.dev/confidentialitate" data-i="priv"></a></div>
  <div data-i="note"></div>
</footer>
</div>
<script>
const T={
en:{h1:"See what your Mac is doing.",lead:"A free, lightweight system monitor that lives in the menu bar: CPU, memory, network, disks, battery and top processes.",dl:"Download for macOS",req:"macOS 13 or later · Apple Silicon · free, no account",c1t:"Light by design",c1:"One shared sampler, paused while your Mac sleeps.",c2t:"Private",c2:"No account, no telemetry. Everything stays on your Mac.",c3t:"Three languages",c3:"Romanian, English and Spanish, following your system.",c4t:"Safe updates",c4:"SHA-256 and developer signature checked before install, with automatic rollback.",ih:"Install",i1:"Download the .pkg.",i2:"Double-click it and follow the installer.",i3:"Farul appears in the menu bar.",credit:"© 2026 Dumitru Cristinel Gordas (GDC). Open source, MIT license.",src:"Source code",terms:"Terms",priv:"Privacy",note:"Provided “as is”, free of charge."},
ro:{h1:"Vezi ce face Mac-ul tău.",lead:"Un monitor de sistem gratuit și ușor, în bara de meniu: procesor, memorie, rețea, discuri, baterie și procesele active.",dl:"Descarcă pentru macOS",req:"macOS 13 sau mai nou · Apple Silicon · gratuit, fără cont",c1t:"Ușor prin construcție",c1:"Un singur eșantionator, oprit cât doarme Mac-ul.",c2t:"Privat",c2:"Fără cont, fără telemetrie. Totul rămâne pe Mac-ul tău.",c3t:"Trei limbi",c3:"Română, engleză și spaniolă, după sistem.",c4t:"Actualizări sigure",c4:"SHA-256 și semnătura dezvoltatorului verificate înainte de instalare, cu revenire automată.",ih:"Instalare",i1:"Descarcă fișierul .pkg.",i2:"Dă dublu-clic și urmează instalatorul.",i3:"Farul apare în bara de meniu.",credit:"© 2026 Dumitru Cristinel Gordas (GDC). Cod deschis, licență MIT.",src:"Cod sursă",terms:"Termeni",priv:"Confidențialitate",note:"Oferit „ca atare”, gratuit."},
es:{h1:"Mira qué hace tu Mac.",lead:"Un monitor de sistema gratuito y ligero en la barra de menús: procesador, memoria, red, discos, batería y procesos activos.",dl:"Descargar para macOS",req:"macOS 13 o posterior · Apple Silicon · gratis, sin cuenta",c1t:"Ligero por diseño",c1:"Un único muestreador, en pausa mientras el Mac duerme.",c2t:"Privado",c2:"Sin cuenta, sin telemetría. Todo se queda en tu Mac.",c3t:"Tres idiomas",c3:"Rumano, inglés y español, según tu sistema.",c4t:"Actualizaciones seguras",c4:"SHA-256 y firma del desarrollador verificados antes de instalar, con reversión automática.",ih:"Instalación",i1:"Descarga el archivo .pkg.",i2:"Haz doble clic y sigue el instalador.",i3:"Farul aparece en la barra de menús.",credit:"© 2026 Dumitru Cristinel Gordas (GDC). Código abierto, licencia MIT.",src:"Código fuente",terms:"Términos",priv:"Privacidad",note:"Se ofrece «tal cual», gratis."}
};
function pick(){try{const s=localStorage.getItem("farul-lang");if(s&&T[s])return s}catch(e){}const n=(navigator.language||"en").slice(0,2);return T[n]?n:"ro"}
function set(l){document.documentElement.lang=l;try{localStorage.setItem("farul-lang",l)}catch(e){}
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T[l][e.dataset.i]);
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
 const dark=matchMedia("(prefers-color-scheme: dark)").matches;const s=document.getElementById("shot");s.src="img/farul-"+l+"-"+(dark?"dark":"light")+".jpg";s.alt="Farul — "+T[l].h1}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>set(b.dataset.l));
set(pick());
</script>
</body>
</html>
