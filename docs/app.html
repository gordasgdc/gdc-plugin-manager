<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161A">
<title>GDC Manager</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- =============================================================================
     GDC Manager — interfata de aplicatie pentru mobil (PWA / APK)
     -----------------------------------------------------------------------------
     ASTA e ecranul pe care il vede utilizatorul cand deschide APK-ul, NU
     index.html (care ramane pagina de prezentare pentru vizitatorii din browser).
     Legatura se face prin "start_url" din manifest.webmanifest.

     Tot continutul vine din /catalog.json, exact acelasi fisier pe care il
     citeste si aplicatia de desktop. Consecinta: un produs, curs sau eveniment
     nou apare aici automat, fara APK nou.

     CUM SE ADAUGA UN TAB NOU:
       1. adauga un <button class="tab" data-tab="nume"> in <nav class="tabbar">
       2. adauga <section id="view-nume" class="view">
       3. adauga randarea in renderAll()
     La orice modificare aici, incrementeaza CACHE_VERSION din sw.js.
============================================================================= -->

<style>
  :root{
    /* Paleta preluata din index.html, ca aplicatia si site-ul sa arate la fel. */
    --bg:#14161A; --bg-2:#101216; --panel:#1A1D22; --panel-2:#20232A;
    --border:#2B2F36; --text:#EDEFF2; --muted:#93989F; --faint:#5C6169;
    --accent:#E8963C; --accent-ink:#1A1108; --accent-dim:#B96A1E;
    --warn:#e8b64c; --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    /* Inaltimile barelor fixe; folosite ca padding pe zona de continut. */
    --topbar-h:56px; --tabbar-h:60px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    line-height:1.5; -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  a{ color:inherit; text-decoration:none; }
  img{ display:block; max-width:100%; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  /* ── Bara de sus: identitate, stare conexiune, cont ──────────────────────── */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20; height:calc(var(--topbar-h) + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) 16px 0; display:flex; align-items:center; gap:12px;
    background:rgba(20,22,26,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .brand img{ width:30px; height:30px; border-radius:8px; }
  .brand-txt strong{ display:block; font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .brand-txt span{ display:block; font-size:11px; color:var(--faint); font-family:var(--mono); }
  .status{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); font-family:var(--mono); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(232,150,60,.15); }
  .status.off .dot{ background:var(--warn); box-shadow:0 0 0 3px rgba(232,182,76,.15); }
  .acct{ width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
         background:var(--panel); display:grid; place-items:center; flex-shrink:0; }

  /* ── Zona de continut ───────────────────────────────────────────────────── */
  main{
    padding:calc(var(--topbar-h) + env(safe-area-inset-top) + 12px) 14px
            calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 20px);
    min-height:100%;
  }
  .view{ display:none; }
  .view.active{ display:block; animation:fade .18s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }

  .section-title{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    margin:18px 2px 10px; font-size:12px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--faint); font-family:var(--mono);
  }
  .section-title:first-child{ margin-top:2px; }
  .section-title b{ color:var(--muted); font-weight:600; }

  /* ── Card compact de produs (rand cu iconita, nume, meta, stare) ─────────── */
  .card{
    display:flex; align-items:center; gap:12px; padding:12px;
    background:var(--panel); border:1px solid var(--border); border-radius:14px; margin-bottom:8px;
  }
  .card:active{ background:var(--panel-2); }
  .ico{
    width:42px; height:42px; border-radius:11px; flex-shrink:0; display:grid; place-items:center;
    background:linear-gradient(150deg,rgba(232,150,60,.16),rgba(232,150,60,.04));
    border:1px solid rgba(232,150,60,.18); color:var(--accent);
  }
  .ico svg{ width:20px; height:20px; }
  .card-body{ flex:1; min-width:0; }
  .card-body h3{ font-size:14.5px; font-weight:600; letter-spacing:-.01em;
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-body p{ font-size:11.5px; color:var(--faint); font-family:var(--mono); margin-top:2px;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chev{ color:var(--faint); flex-shrink:0; }

  /* ── Etichete de stare ──────────────────────────────────────────────────── */
  .badge{
    font-size:10.5px; font-weight:700; padding:4px 8px; border-radius:999px;
    font-family:var(--mono); white-space:nowrap; flex-shrink:0; letter-spacing:.02em;
  }
  .badge.free{ background:rgba(232,150,60,.14); color:var(--accent); }
  .badge.paid{ background:rgba(232,182,76,.14); color:var(--warn); }
  .badge.trial{ background:rgba(242,183,102,.14); color:#F2B766; }

  /* ── Filtre pe tip (Toate / LUT / DCTL / PowerGrade) ─────────────────────── */
  .chips{ display:flex; gap:7px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    padding:7px 13px; border-radius:999px; border:1px solid var(--border);
    background:var(--panel); font-size:12.5px; color:var(--muted); white-space:nowrap; font-weight:500;
  }
  .chip.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }

  /* ── Card mare, cu coperta (cursuri, evenimente, magazine) ───────────────── */
  .rich{ background:var(--panel); border:1px solid var(--border); border-radius:16px;
         overflow:hidden; margin-bottom:12px; }
  .rich img{ width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--bg-2); }
  .rich .pad{ padding:13px 14px 15px; }
  .rich h3{ font-size:15.5px; font-weight:700; letter-spacing:-.01em; }
  .rich .meta{ font-size:11.5px; color:var(--accent); font-family:var(--mono); margin-top:5px;
               display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .rich p{ font-size:13px; color:var(--muted); margin-top:8px;
           display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .rich .go{ display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-size:13px;
             font-weight:600; color:var(--accent); }

  /* ── Stari speciale: gol, eroare, incarcare ─────────────────────────────── */
  .empty{ text-align:center; padding:52px 24px; color:var(--faint); }
  .empty svg{ width:38px; height:38px; margin:0 auto 12px; opacity:.5; }
  .empty p{ font-size:13.5px; }
  .skel{ height:66px; border-radius:14px; margin-bottom:8px;
         background:linear-gradient(90deg,var(--panel) 25%,var(--panel-2) 50%,var(--panel) 75%);
         background-size:200% 100%; animation:sh 1.3s infinite; }
  @keyframes sh{ to{ background-position:-200% 0; } }

  .notice{ background:rgba(232,182,76,.1); border:1px solid rgba(232,182,76,.25);
           border-radius:12px; padding:11px 13px; font-size:12.5px; color:var(--muted); margin-bottom:14px; }
  .notice b{ color:var(--warn); }

  /* ── Bara de tab-uri de jos ─────────────────────────────────────────────── */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:20; display:grid; grid-template-columns:repeat(5,1fr);
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
    background:rgba(20,22,26,.94); backdrop-filter:blur(12px); border-top:1px solid var(--border);
  }
  .tab{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
        color:var(--faint); font-size:9.5px; font-weight:600; transition:color .15s; padding:0 2px; }
  .tab svg{ width:20px; height:20px; }
  .tab.on{ color:var(--accent); }

  /* ── Filigran sezonier (Etapa 6, paritate mobil 2026-08-29) ──────────────── */
  /* Pozitia (jos-dreapta / jos-stanga / sus-* / centru) vine acum din
     catalog, per filigran — vezi SeasonalPosition (Core). Clasa de baza
     ramane fara ancorare; o clasa .pos-* o adauga. */
  .seasonal-bg{
    position:fixed; width:320px; height:320px; z-index:1;
    opacity:.07; pointer-events:none; object-fit:contain;
  }
  .seasonal-bg.pos-bottomTrailing{ right:-40px; bottom:-40px; }
  .seasonal-bg.pos-bottomLeading { left:-40px;  bottom:-40px; }
  .seasonal-bg.pos-topTrailing   { right:-40px; top:-40px; }
  .seasonal-bg.pos-topLeading    { left:-40px;  top:-40px; }
  .seasonal-bg.pos-center        { left:50%; top:50%; transform:translate(-50%,-50%); }

  /* ── Buton hartă / link secundar (chip mic pe cardul rich) ───────────────── */
  .mini-links{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .mini-link{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
              color:var(--muted); background:var(--panel-2); border:1px solid var(--border);
              border-radius:999px; padding:6px 11px; }
  .mini-link svg{ width:13px; height:13px; }
  .badge.discount{ background:rgba(232,76,76,.14); color:#E85C5C; }
  .badge.promo{ background:rgba(232,76,76,.14); color:#E85C5C; }

  /* ── Fereastra de cont ──────────────────────────────────────────────────── */
  .sheet{ position:fixed; inset:0; z-index:40; display:none; }
  .sheet.open{ display:block; }
  .sheet-bg{ position:absolute; inset:0; background:rgba(0,0,0,.6); }
  .sheet-panel{
    position:absolute; left:0; right:0; bottom:0; background:var(--bg-2);
    border-top:1px solid var(--border); border-radius:20px 20px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    animation:up .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes up{ from{ transform:translateY(100%); } to{ transform:none; } }
  .sheet-panel h2{ font-size:17px; font-weight:700; margin-bottom:4px; }
  .sheet-panel .row{ display:flex; justify-content:space-between; gap:12px; padding:11px 0;
                     border-bottom:1px solid var(--border); font-size:13.5px; }
  .sheet-panel .row:last-of-type{ border-bottom:none; }
  .sheet-panel .row span{ color:var(--muted); }
  .sheet-panel .row b{ font-family:var(--mono); font-weight:600; font-size:12.5px; }
  .btn{ display:block; width:100%; text-align:center; margin-top:16px; padding:13px;
        border-radius:12px; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:14.5px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="/icons/icon-192.png" alt="">
    <div class="brand-txt">
      <strong>GDC Manager</strong>
      <span id="updated">se incarca…</span>
    </div>
  </div>
  <div class="status" id="status"><span class="dot"></span><span id="status-txt">online</span></div>
  <button class="acct" id="acct-btn" aria-label="Cont">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="17" height="17">
      <circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-3.6 3.4-5.5 7.5-5.5s7.5 1.9 7.5 5.5"/>
    </svg>
  </button>
</header>

<div id="seasonal-bg"></div>

<main>
  <!-- Tab 1: produsele — aplicatii desktop + plugin-uri/LUT/DCTL -->
  <section class="view active" id="view-produse">
    <div class="chips" id="chips"></div>
    <div id="produse-list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </section>

  <!-- Tab 2 (NOU, 2026-08-29): resurse download — LUT/SFX/VFX/Plugin cross-host,
       segmentate separat de plugin-urile cu auto-instalare in Resolve. -->
  <section class="view" id="view-resurse">
    <div class="chips" id="resurse-chips"></div>
    <div id="resurse-list"></div>
  </section>

  <!-- Tab 3: cursuri si resurse educationale -->
  <section class="view" id="view-cursuri"><div id="cursuri-list"></div></section>

  <!-- Tab 4: evenimente si workshop-uri -->
  <section class="view" id="view-evenimente"><div id="evenimente-list"></div></section>

  <!-- Tab 5 (extins 2026-08-29): magazine partenere + servicii + oferte + pachete -->
  <section class="view" id="view-comunitate"><div id="comunitate-list"></div></section>
</main>

<nav class="tabbar">
  <button class="tab on" data-tab="produse">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>
    Produse
  </button>
  <button class="tab" data-tab="resurse">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v13M7 11l5 5 5-5"/><path d="M4 19.5h16"/></svg>
    Resurse
  </button>
  <button class="tab" data-tab="cursuri">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 4v16"/></svg>
    Cursuri
  </button>
  <button class="tab" data-tab="evenimente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    Evenimente
  </button>
  <button class="tab" data-tab="comunitate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h16l-1 12H5z"/><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/></svg>
    Comunitate
  </button>
</nav>

<div class="sheet" id="sheet">
  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet-panel">
    <h2>Contul tau</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Starea aplicatiei pe acest telefon.</p>
    <div class="row"><span>Licente</span><b id="acct-lic">se gestioneaza pe desktop</b></div>
    <div class="row"><span>Catalog</span><b id="acct-cat">—</b></div>
    <div class="row"><span>Conexiune</span><b id="acct-net">—</b></div>
    <div class="row"><span>Versiune</span><b>1.1.0</b></div>
    <a class="btn" href="/#download">Descarca aplicatia de desktop</a>
  </div>
</div>

<script>
/* =============================================================================
   Logica aplicatiei. Fara framework si fara dependinte externe: tot fisierul
   trebuie sa functioneze offline, din cache-ul service worker-ului.
============================================================================= */

// Iconite pentru tipurile de continut. Cheile sunt numele SF Symbols folosite de
// aplicatia de desktop in catalog.json — pe web nu exista SF Symbols, asa ca le
// mapam la SVG-uri proprii. Necunoscutele cad pe 'default'.
const ICONS = {
  'eyedropper.halffull':'<path d="M17 3.5a2.5 2.5 0 0 1 3.5 3.5l-8 8-3.5-3.5z"/><path d="M8.5 12.5 4 17v3h3l4.5-4.5"/>',
  'wand.and.stars':'<path d="M4 20 16 8"/><path d="M14 4l1 2.5L17.5 7.5 15 8.5 14 11l-1-2.5L10.5 7.5 13 6.5z"/><path d="M19 13l.7 1.6 1.8.7-1.8.7L19 17.6l-.7-1.6-1.8-.7 1.8-.7z"/>',
  'paintpalette':'<path d="M12 3.5c-4.7 0-8.5 3.6-8.5 8s3.8 8 8.5 8c1.4 0 2-1 1.5-1.9-.6-1.1.2-2.3 1.5-2.3h1.5c2.5 0 4.5-2 4.5-4.4 0-4-3.8-7.4-9-7.4z"/><circle cx="8" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="16" cy="10" r="1.1" fill="currentColor" stroke="none"/>',
  'app':'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 12h7M12 8.5v7"/>',
  'waveform':'<path d="M4 12v2M7.5 8v10M11 5v16M14.5 8v10M18 10v6M21 12v2"/>',
  'sparkles':'<path d="M12 3l1.4 4.6L18 9l-4.6 1.4L12 15l-1.4-4.6L6 9l4.6-1.4z"/><path d="M19 15l.6 2 2 .6-2 .6-.6 2-.6-2-2-.6 2-.6z"/>',
  'puzzlepiece.extension':'<path d="M9 4h4v2.5a1.7 1.7 0 0 0 3 1.1V4h4v4h-2.6a1.7 1.7 0 0 0 0 3H20v4h-4v-2.5a1.7 1.7 0 0 0-3 0V15H9v-2.6a1.7 1.7 0 0 0-3 0V15H4v-4h2.5a1.7 1.7 0 0 0 0-3H4V4h5z"/>',
  'default':'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/>'
};
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||ICONS.default}</svg>`;
const CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>';
const PIN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.3"/></svg>';
const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3zm0 16.4a7.4 7.4 0 0 1-3.8-1l-.3-.2-2.8.7.7-2.7-.2-.3A7.4 7.4 0 1 1 12 19.4zm4.1-5.5c-.2-.1-1.3-.7-1.5-.7-.2-.1-.4-.1-.5.1s-.6.7-.7.9-.3.2-.5.1a6 6 0 0 1-1.8-1.1 6.7 6.7 0 0 1-1.2-1.5c-.1-.2 0-.4.1-.5l.4-.4c.1-.1.1-.2.2-.4s0-.3 0-.4-.5-1.2-.7-1.7-.4-.4-.5-.4h-.4a.9.9 0 0 0-.6.3 2.6 2.6 0 0 0-.8 1.9c0 1.1.8 2.2.9 2.4s1.6 2.4 3.8 3.4a13 13 0 0 0 1.3.5 3.1 3.1 0 0 0 1.4.1 2.3 2.3 0 0 0 1.5-1.1 1.9 1.9 0 0 0 .1-1.1c-.1-.1-.2-.2-.4-.3z"/></svg>';
const YT_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.7 2.7 0 0 0-1.9-1.9C18 5 12 5 12 5s-6 0-7.7.3a2.7 2.7 0 0 0-1.9 1.9A28 28 0 0 0 2 12a28 28 0 0 0 .4 4.8 2.7 2.7 0 0 0 1.9 1.9C6 19 12 19 12 19s6 0 7.7-.3a2.7 2.7 0 0 0 1.9-1.9A28 28 0 0 0 22 12a28 28 0 0 0-.4-4.8zM10 15V9l5 3z"/></svg>';
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.5 14.5l5-5M8 17l-2 2a3.5 3.5 0 0 1-5-5l3-3a3.5 3.5 0 0 1 5 0M16 7l2-2a3.5 3.5 0 0 1 5 5l-3 3a3.5 3.5 0 0 1-5 0"/></svg>';
// LinkedIn (2026-08-29) — monocrom, in acelasi stil ca PIN/WA/YT: silueta
// "in" desenata cu forme simple, nu logo-ul oficial colorat.
const LI_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 3a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zM3 8.4h3V21H3zM9 8.4h2.9v1.7h.05a3.2 3.2 0 0 1 2.87-1.6c3.07 0 3.64 2 3.64 4.62V21h-3v-5.3c0-1.27-.02-2.9-1.77-2.9-1.78 0-2.05 1.38-2.05 2.8V21H9z"/></svg>';

// Etichetele tipurilor din catalog.json, pentru afisare.
const TYPE_LABEL = { lut:'LUT', dctl:'DCTL', powerGrade:'PowerGrade', fuse:'Fuse', app:'Aplicatie' };
const CATEGORY_LABEL = { lut:'LUT', sfx:'SFX', vfx:'VFX', plugin:'Plugin' };

// Escapare HTML: continutul vine din catalog.json, deci nu il injectam brut.
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ── Scheduling (Etapa 4, paritate mobil 2026-08-29) ─────────────────────────
// `Date` din Swift se codeaza JSON ca secunde de la 2001-01-01 00:00:00 UTC
// (referinta Core Data), NU epoch Unix — 978307200000 e acel moment, in ms.
const SWIFT_REF_MS = 978307200000;
function isActiveNow(sch) {
  if (!sch) return true;
  const now = Date.now();
  if (sch.startDate != null && now < SWIFT_REF_MS + sch.startDate * 1000) return false;
  if (sch.endDate != null && now > SWIFT_REF_MS + sch.endDate * 1000) return false;
  return true;
}

// ── Harta (Etapa 5) — identic cu `MapsLink` din aplicatia de desktop:
// termenii non-fizici (Online, Zoom etc.) nu produc niciun link. ─────────────
const NON_PHYSICAL = new Set(['online','webinar','virtual','remote','la distanta','distanta','zoom','internet','n/a','-']);
function mapsUrl(address) {
  const trimmed = (address || '').trim();
  if (!trimmed) return null;
  const normalized = trimmed.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  if (NON_PHYSICAL.has(normalized)) return null;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(trimmed);
}

// ── WhatsApp (acelasi numar spart in bucati ca in WhatsAppLink.swift,
// ca sa nu apara ca sir contiguu usor de recoltat de crawlere). ─────────────
function waLink(text) {
  const number = ['34','643','109','970'].join('');
  return 'https://wa.me/' + number + (text ? ('?text=' + encodeURIComponent(text)) : '');
}
const buyText = (name, priceEUR) => `Salut! Vreau sa deblochez ${name} cu o donatie de ${priceEUR.toFixed(2)} EUR.`;

/** Randul de linkuri secundare: social, purchase/demo, harta. Omis daca nu e nimic. */
function miniLinks(items) {
  const parts = items.filter(Boolean);
  if (!parts.length) return '';
  return `<div class="mini-links">${parts.join('')}</div>`;
}
function miniLink(icon, label, url) {
  if (!url) return '';
  return `<a class="mini-link" href="${esc(url)}" target="_blank" rel="noopener">${icon}${esc(label)}</a>`;
}
function socialMiniLinks(social) {
  if (!social) return [];
  return [
    miniLink(LINK_ICON, 'Facebook', social.facebookURL),
    miniLink(YT_ICON, 'YouTube', social.youtubeURL),
    miniLink(LINK_ICON, 'Instagram', social.instagramURL),
    miniLink(LINK_ICON, 'TikTok', social.tiktokURL),
    miniLink(LI_ICON, 'LinkedIn', social.linkedinURL),
  ].filter(Boolean);
}

let CATALOG = null;
let filter = 'toate';
let resurseFilter = 'toate';

// ── Incarcarea catalogului ──────────────────────────────────────────────────
// Service worker-ul trateaza catalog.json ca network-first, deci primim mereu
// varianta proaspata cand exista retea, si ultima varianta salvata cand nu.
async function load() {
  try {
    const res = await fetch('/catalog.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    CATALOG = await res.json();
    renderAll();
  } catch (err) {
    console.warn('Catalog indisponibil:', err);
    document.getElementById('produse-list').innerHTML = emptyState(
      'Nu am putut incarca catalogul. Verifica conexiunea si trage in jos pentru reincercare.'
    );
  }
}

const emptyState = (txt) => `<div class="empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
  <p>${esc(txt)}</p></div>`;

// ── Randare ─────────────────────────────────────────────────────────────────
function renderAll() {
  const c = CATALOG;
  document.getElementById('updated').textContent = 'catalog ' + (c.updatedAt || '');
  document.getElementById('acct-cat').textContent = c.updatedAt || '—';
  renderSeasonalBackground();
  renderProduse(); renderResurse(); renderCursuri(); renderEvenimente(); renderComunitate();
}

// Filigrane sezoniere — BIBLIOTECA (2026-08-29), paritate cu Mac: mai multe
// filigrane, fiecare cu perioada si pozitie proprie. Port 1:1 al deciziei de
// coliziune din Core (`activeNowDeduplicated`): la aceeasi pozitie castiga
// ULTIMUL din lista; pozitii diferite se randeaza toate.
// Fara AsyncImage-ul problematic de pe Mac — un <img> de browser randeaza SVG nativ.
function activeSeasonalBackgrounds() {
  // Migrare in citire, ca in Swift: un catalog.json vechi are cheia
  // singulara `seasonalBackground` (string), fara perioada si fara pozitie.
  let list = CATALOG.seasonalBackgrounds;
  if (!Array.isArray(list)) {
    list = CATALOG.seasonalBackground
      ? [{ id: 'migrat-2026-08-29', imagePath: CATALOG.seasonalBackground }]
      : [];
  }
  const byPosition = new Map();
  for (const cfg of list) {
    const enabled = cfg.isEnabled !== false;         // lipsa = activ
    if (!enabled || !isActiveNow(cfg.scheduling)) continue;
    byPosition.set(cfg.position || 'bottomTrailing', cfg); // ultimul castiga
  }
  return [...byPosition.entries()];
}

function renderSeasonalBackground() {
  const el = document.getElementById('seasonal-bg');
  el.innerHTML = activeSeasonalBackgrounds().map(([position, cfg]) =>
    `<img class="seasonal-bg pos-${esc(position)}" alt="" src="${esc(cfg.imagePath)}">`
  ).join('');
}

function renderProduse() {
  const apps = (CATALOG.apps || []).filter(a => isActiveNow(a.scheduling));
  const items = (CATALOG.items || []).filter(i => isActiveNow(i.scheduling));
  const audioTracks = (CATALOG.audioTracks || []).filter(t => isActiveNow(t.scheduling));

  // Chip-urile de filtrare se construiesc din tipurile care exista efectiv.
  const types = [...new Set(items.map(i => i.type))];
  document.getElementById('chips').innerHTML =
    ['toate', 'aplicatii', 'audio', ...types].map(t =>
      `<button class="chip ${t===filter?'on':''}" data-f="${esc(t)}">${
        t==='toate' ? 'Toate' : t==='aplicatii' ? 'Aplicatii' : t==='audio' ? 'Audio' : (TYPE_LABEL[t]||t)
      }</button>`).join('');

  let html = '';
  if (filter === 'toate' || filter === 'aplicatii') {
    html += `<div class="section-title">Aplicatii desktop <b>${apps.length}</b></div>`;
    html += apps.map(a => {
      const links = miniLinks(socialMiniLinks(a.socialLinks));
      const row = `
        <div class="ico">${a.coverImage
          ? `<img src="${esc(a.coverImage)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:11px" onerror="this.parentElement.innerHTML='${svg('app').replace(/'/g,"&#39;").replace(/"/g,"&quot;")}'">`
          : svg('app')}</div>
        <div class="card-body"><h3>${esc(a.name)}</h3><p>Mac &middot; Windows</p></div>
        ${CHEV}`;
      // Fara linkuri sociale: cardul ramane EXACT ce era (un singur <a>).
      // Cu linkuri: ancorele sociale nu pot sta intr-un <a> parinte (HTML
      // invalid, ancore imbricate), deci cardul devine un <div> in coloana,
      // cu randul principal ca ancora separata — acelasi tipar ca la Produse.
      if (!links) return `<a class="card" href="${esc(a.url)}" target="_blank" rel="noopener">${row}</a>`;
      return `<div class="card" style="flex-direction:column;align-items:stretch">
        <a href="${esc(a.url)}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none">${row}</a>
        ${links}
      </div>`;
    }).join('');
  }

  if (filter === 'toate' || filter === 'audio') {
    html += `<div class="section-title">Audio <b>${audioTracks.length}</b></div>`;
    html += audioTracks.map(t => `
      <a class="card" href="${esc(t.url)}" target="_blank" rel="noopener">
        <div class="ico">${t.coverImage
          ? `<img src="${esc(t.coverImage)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:11px" onerror="this.parentElement.innerHTML='${svg('waveform').replace(/'/g,"&#39;").replace(/"/g,"&quot;")}'">`
          : svg('waveform')}</div>
        <div class="card-body"><h3>${esc(t.name)}</h3><p>${esc(t.description || 'Fisier audio')}</p></div>
        ${CHEV}
      </a>`).join('');
  }

  const shown = items.filter(i => filter==='toate' || filter===i.type);
  if (shown.length) {
    html += `<div class="section-title">Plugin-uri, LUT &amp; DCTL <b>${shown.length}</b></div>`;
    html += shown.map(i => {
      // Statusul afisat vine STRICT din date: nu inventam "Descarcat"/"Nou",
      // fiindca instalarea si licenta se gestioneaza in aplicatia de desktop.
      const promo = i.promoPriceEUR != null && isActiveNow(i.scheduling);
      const price = promo ? i.promoPriceEUR : i.priceEUR;
      const badge = i.isFree ? '<span class="badge free">Gratuit</span>'
                  : i.isTrial ? '<span class="badge trial">Trial</span>'
                  : promo ? `<span class="badge promo">Susținere ${esc(price)} &euro;</span>`
                  : `<span class="badge paid">${esc(price)} &euro;</span>`;
      const n = (i.files || []).length;
      const links = miniLinks([
        miniLink(LINK_ICON, 'Cumpără', i.purchaseURL),
        miniLink(LINK_ICON, 'Demo', i.demoURL),
        ...socialMiniLinks(i.socialLinks),
      ]);
      return `<div class="card" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="ico">${svg(i.iconSymbol)}</div>
          <div class="card-body">
            <h3>${esc(i.name)}</h3>
            <p>${esc(TYPE_LABEL[i.type] || i.type)} &middot; v${esc(i.version)} &middot; ${n} fisier${n===1?'':'e'}</p>
          </div>${badge}
        </div>${links}
      </div>`;
    }).join('');
  }

  document.getElementById('produse-list').innerHTML = html || emptyState('Niciun produs pentru filtrul ales.');
}

// ── Tab NOU: Resurse download (LUT/SFX/VFX/Plugin, Etapa 2) ─────────────────
function renderResurse() {
  const all = (CATALOG.downloadableResources || []).filter(r => isActiveNow(r.scheduling));
  const cats = [...new Set(all.map(r => r.category))];
  document.getElementById('resurse-chips').innerHTML =
    ['toate', ...cats].map(cat =>
      `<button class="chip ${cat===resurseFilter?'on':''}" data-rf="${esc(cat)}">${
        cat==='toate' ? 'Toate' : (CATEGORY_LABEL[cat] || cat)
      }</button>`).join('');

  const shown = all.filter(r => resurseFilter==='toate' || resurseFilter===r.category);
  const el = document.getElementById('resurse-list');
  if (!shown.length) { el.innerHTML = emptyState('Nicio resursă de download pentru filtrul ales.'); return; }

  el.innerHTML = `<div class="section-title">Resurse download <b>${shown.length}</b></div>` +
    shown.map(r => {
      const promo = r.promoPriceEUR != null && isActiveNow(r.scheduling);
      const price = promo ? r.promoPriceEUR : r.priceEUR;
      const badge = r.isFree ? '<span class="badge free">Gratuit</span>'
                  : r.isTrial ? '<span class="badge trial">Trial</span>'
                  : promo ? `<span class="badge promo">Susținere ${esc(price)} &euro;</span>`
                  : `<span class="badge paid">${esc(price)} &euro;</span>`;
      // Gratuit -> link direct de descarcare. Platit/trial -> WhatsApp,
      // la fel ca fluxul de pe desktop (licenta se activeaza tot acolo).
      const primaryURL = r.isFree ? r.url : waLink(buyText(r.name, price));
      const links = miniLinks([
        miniLink(LINK_ICON, 'Cumpără', r.purchaseURL),
        miniLink(LINK_ICON, 'Demo', r.demoURL),
        ...socialMiniLinks(r.socialLinks),
      ]);
      return `<a class="card" style="flex-direction:column;align-items:stretch" href="${esc(primaryURL)}" target="_blank" rel="noopener">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="ico">${svg(DownloadCategoryIcon(r.category))}</div>
          <div class="card-body">
            <h3>${esc(r.name)}</h3>
            <p>${esc(CATEGORY_LABEL[r.category] || r.category)} &middot; ${esc(r.description || '')}</p>
          </div>${badge}
        </div>${links}
      </a>`;
    }).join('');
}
function DownloadCategoryIcon(cat) {
  return { lut:'eyedropper.halffull', sfx:'waveform', vfx:'sparkles', plugin:'puzzlepiece.extension' }[cat] || 'default';
}

function renderCursuri() {
  // catalog.json are doua liste separate: 'courses' si 'educationalResources'.
  const all = [...(CATALOG.courses || []), ...(CATALOG.educationalResources || [])]
    .filter(r => isActiveNow(r.scheduling));
  const el = document.getElementById('cursuri-list');
  if (!all.length) { el.innerHTML = emptyState('Nu sunt cursuri publicate momentan.'); return; }
  el.innerHTML = `<div class="section-title">Cursuri si resurse <b>${all.length}</b></div>` +
    all.map(r => richCard({
      cover: r.coverImage, title: r.name || r.title,
      meta: r.kind === 'course' ? 'Curs' : 'Resursa educationala',
      desc: r.description, url: r.externalURL || r.youtubeURL, cta: 'Deschide',
      extra: miniLinks(socialMiniLinks(r.socialLinks))
    })).join('');
}

function renderEvenimente() {
  const evs = (CATALOG.events || []).filter(e => isActiveNow(e.scheduling));
  const el = document.getElementById('evenimente-list');
  if (!evs.length) { el.innerHTML = emptyState('Niciun eveniment programat momentan.'); return; }
  el.innerHTML = `<div class="section-title">Evenimente si workshop-uri <b>${evs.length}</b></div>` +
    evs.map(e => richCard({
      cover: e.coverImage, title: e.title,
      // 'dateDisplay' contine adesea si localitatea ("26-29 octombrie, Sighisoara"),
      // asa ca adaugam 'location' doar cand nu e deja acolo — altfel apare de doua ori.
      meta: [e.dateDisplay, (e.dateDisplay || '').includes(e.location || '\u0000') ? '' : e.location]
              .filter(Boolean).join(' &middot; '),
      desc: e.description, url: e.externalURL, cta: 'Detalii si inscriere',
      extra: miniLinks([
        miniLink(PIN_ICON, 'Deschide harta', mapsUrl(e.location)),
        ...socialMiniLinks(e.socialLinks),
      ])
    })).join('');
}

// ── Tab "Comunitate" (extins 2026-08-29): magazine + servicii + oferte + pachete ──
function renderComunitate() {
  const stores = (CATALOG.partnerStores || []).filter(s => isActiveNow(s.scheduling));
  const services = (CATALOG.serviceCenters || []).filter(s => isActiveNow(s.scheduling));
  const offers = (CATALOG.partnerOffers || []).filter(o => isActiveNow(o.scheduling));
  const bundles = (CATALOG.productBundles || []).filter(b => isActiveNow(b.scheduling));
  const el = document.getElementById('comunitate-list');

  let html = '';

  if (bundles.length) {
    html += `<div class="section-title">Pachete <b>${bundles.length}</b></div>`;
    html += bundles.map(b => {
      const names = b.items.map(ref => resolveBundleItemName(ref)).filter(Boolean).join(', ');
      return richCard({
        cover: b.coverImage, title: b.name,
        meta: `Pachet &middot; ${esc(b.bundlePriceEUR)} &euro;`,
        desc: (b.description ? b.description + ' — ' : '') + 'Include: ' + names,
        url: waLink(buyText(b.name, b.bundlePriceEUR)), cta: 'Cumpără pachetul',
        extra: miniLinks(socialMiniLinks(b.socialLinks))
      });
    }).join('');
  }

  if (offers.length) {
    html += `<div class="section-title">Oferte parteneri <b>${offers.length}</b></div>`;
    html += offers.map(o => richCard({
      cover: o.coverImage, title: o.brandName,
      meta: [o.discountText ? `<span class="badge discount">${esc(o.discountText)}</span>` : '',
             o.couponCode ? `Cod: ${esc(o.couponCode)}` : ''].filter(Boolean).join(' &middot; '),
      desc: o.description, url: o.url, cta: 'Vezi oferta',
      extra: miniLinks(socialMiniLinks(o.socialLinks))
    })).join('');
  }

  if (stores.length) {
    html += `<div class="section-title">Magazine partenere <b>${stores.length}</b></div>`;
    html += stores.map(s => richCard({
      cover: s.coverImage, title: s.name, meta: 'Partener',
      desc: s.description, url: s.url, cta: 'Viziteaza magazinul',
      extra: miniLinks([
        miniLink(PIN_ICON, 'Deschide harta', mapsUrl(s.address)),
        ...socialMiniLinks(s.socialLinks),
      ])
    })).join('');
  }

  if (services.length) {
    html += `<div class="section-title">Servicii &amp; reparații <b>${services.length}</b></div>`;
    html += services.map(s => richCard({
      cover: s.coverImage, title: s.name, meta: s.specialization,
      desc: '', url: s.contactURL, cta: 'Contact',
      extra: miniLinks([
        miniLink(PIN_ICON, 'Deschide harta', mapsUrl(s.address)),
        miniLink(LINK_ICON, 'Website', s.websiteURL),
        ...socialMiniLinks(s.socialLinks),
      ])
    })).join('');
  }

  el.innerHTML = html || emptyState('Nimic publicat momentan în Comunitate.');
}

/** Rezolvă numele unui item dintr-un pachet, indiferent din ce colecție face parte. */
function resolveBundleItemName(ref) {
  const collections = {
    product: CATALOG.items, download: CATALOG.downloadableResources, course: CATALOG.courses,
    audio: CATALOG.audioTracks, app: CATALOG.apps, material: CATALOG.educationalResources,
  };
  const list = collections[ref.kind] || [];
  const match = list.find(x => x.id === ref.id);
  return match ? (match.name || match.title) : null;
}

/** Card mare, cu coperta optionala. Coperta lipsa => cardul se randeaza fara ea. */
function richCard({ cover, title, meta, desc, url, cta, extra }) {
  const img = cover ? `<img src="${esc(cover)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  const link = url ? `<a class="go" href="${esc(url)}" target="_blank" rel="noopener">${esc(cta)} &rarr;</a>` : '';
  return `<div class="rich">${img}<div class="pad">
    <h3>${esc(title)}</h3>
    ${meta ? `<div class="meta">${meta}</div>` : ''}
    ${desc ? `<p>${esc(desc)}</p>` : ''}
    ${link}
    ${extra || ''}
  </div></div>`;
}

// ── Interactiuni ────────────────────────────────────────────────────────────

// Tab-uri
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === btn));
    const name = btn.dataset.tab;
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
    // Hash-ul permite scurtaturile din manifest (ex: /app.html#evenimente).
    history.replaceState(null, '', '#' + name);
    window.scrollTo(0, 0);
  });
});

// Filtre de tip
document.getElementById('chips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  filter = chip.dataset.f;
  renderProduse();
});

// Filtre de categorie — tab Resurse download
document.getElementById('resurse-chips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  resurseFilter = chip.dataset.rf;
  renderResurse();
});

// Starea conexiunii, in bara de sus si in fereastra de cont
function netState() {
  const on = navigator.onLine;
  document.getElementById('status').classList.toggle('off', !on);
  document.getElementById('status-txt').textContent = on ? 'online' : 'offline';
  document.getElementById('acct-net').textContent = on ? 'online' : 'offline (date din cache)';
  if (on && !CATALOG) load();   // reincarcam catalogul cand revine reteaua
}
window.addEventListener('online', netState);
window.addEventListener('offline', netState);

// Fereastra de cont
const sheet = document.getElementById('sheet');
document.getElementById('acct-btn').onclick = () => sheet.classList.add('open');
document.getElementById('sheet-bg').onclick = () => sheet.classList.remove('open');

// Deschiderea pe un tab anume, prin hash (scurtaturile din manifest)
const initial = location.hash.replace('#', '');
if (initial) {
  const btn = document.querySelector(`.tab[data-tab="${CSS.escape(initial)}"]`);
  if (btn) btn.click();
}

// Service worker: aceeasi inregistrare ca pe pagina de prezentare.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

netState();
load();
</script>
